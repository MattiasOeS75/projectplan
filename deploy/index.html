<title>Crosby Produktionsplan</title>

<style>
[hidden]:not([hidden="until-found" i]){display:none!important}
/* Layout: pipeline-band (projekt per fas) överst, beläggningsgrid (personer × arbetsdagar, FM/EM) under. */
:root{
  --bg:#0e1217; --surface:#161b22; --surface2:#1e252e; --fg:#e6ebf0; --muted:#94a1af; --line:#2a323c;
  --accent:#8099ff; --warn:#f0a253; --bad:#ff6e72; --ok:#69db7c;
  --p0:#ff8a4c; --p1:#f06595; --p2:#51cf66; --p3:#f0c030; --p4:#4dabf7; --p5:#9775fa; --p6:#3bc9db; --p7:#f783ac; --p8:#99a4b0;
  color-scheme:dark;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --namew:168px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1217; --surface:#161b22; --surface2:#1e252e; --fg:#e6ebf0; --muted:#94a1af; --line:#2a323c;
  --accent:#8099ff; --warn:#f0a253; --bad:#ff6e72; --ok:#69db7c;
  --p0:#ff8a4c; --p1:#f06595; --p2:#51cf66; --p3:#f0c030; --p4:#4dabf7; --p5:#9775fa; --p6:#3bc9db; --p7:#f783ac; --p8:#99a4b0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1217; --surface:#161b22; --surface2:#1e252e; --fg:#e6ebf0; --muted:#94a1af; --line:#2a323c;
  --accent:#8099ff; --warn:#f0a253; --bad:#ff6e72; --ok:#69db7c;
  --p0:#ff8a4c; --p1:#f06595; --p2:#51cf66; --p3:#f0c030; --p4:#4dabf7; --p5:#9775fa; --p6:#3bc9db; --p7:#f783ac; --p8:#99a4b0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
h1 small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--muted);margin-top:6px}
h2{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin:0}
.note{font-size:13px;color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.busy{opacity:.7;pointer-events:none}
.btn.busy::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.ghost{background:transparent}

/* Pipeline */
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pipe{overflow-x:auto;padding-bottom:4px}
.phases{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:10px;min-width:1320px}
.phase{display:flex;flex-direction:column;gap:8px;min-width:0}
.phase h3{font-family:var(--mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;
  padding-bottom:6px;border-bottom:2px solid var(--line);display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;
  text-align:left;width:100%;border-top:4px solid var(--c);min-width:0}
.card:hover{border-color:var(--c)}
.card .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card b{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.02em;line-height:1.1}
.card .code{font-family:var(--mono);font-size:10px;color:var(--muted)}
.card .st{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.card .meta .lev{color:var(--fg);font-weight:500}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .meta .over{color:var(--bad);font-weight:500}
.wait{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--warn);border-radius:4px;padding:3px 7px;align-self:flex-start}
.empty{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center}
/* kompakt pipeline: bara rubriker */
.phases.compact{gap:8px}
.phases.compact .card{padding:5px 9px;border-top-width:3px;gap:0}
.phases.compact .card b{font-size:15px;line-height:1.15}
.phases.compact .card .code{white-space:nowrap}
.card .shc{color:var(--accent);text-decoration:none;font-weight:700;margin-right:5px;font-size:12px}
.card .shc:hover{text-decoration:underline}
.phases.compact .card .st,.phases.compact .card .wait,.phases.compact .card .meta{display:none}
.phases.compact .card.due{box-shadow:inset 3px 0 0 var(--warn)}
/* arkiverade projekt */
.arch{margin-top:8px}
.arch summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:6px}
.arch summary::before{content:"▸"} .arch[open] summary::before{content:"▾"}
.archlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.archlist .chip{opacity:.8} .archlist .chip button{border:0;background:transparent;color:var(--accent);font-weight:600;padding:0 0 0 6px;font-size:12px}
.archlist .chip button:hover{text-decoration:underline}
.addcard{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:9px;color:var(--muted);font-weight:500}
.addcard:hover{color:var(--accent);border-color:var(--accent)}

/* Toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.range{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 7px;font-size:12px;font-weight:500}
.chip i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}

/* Grid */
.gridwrap{overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-left:var(--namew);overscroll-behavior-x:contain;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.grid{display:grid;min-width:min-content}
.g-h,.g-n,.g-c,.g-m{border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.g-n,.g-corner,.g-mlabel{border-left:0;position:sticky;left:0;z-index:3;background:var(--surface)}
.g-h{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;text-align:center;padding:6px 4px 5px;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface);position:sticky;top:0;z-index:2}
.g-h .wk{display:block;color:var(--fg);font-weight:500;height:14px}
.g-h .dn{display:block;white-space:nowrap;line-height:1.25}
.g-h .tg{display:block;height:14px;font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;line-height:14px}
.g-h.today{background:var(--ok);color:var(--bg)} .g-h.today .wk{color:var(--bg)} .g-h.today .dn{font-weight:600}
.g-m.today{background:color-mix(in srgb,var(--ok) 16%,var(--surface2))}
.g-corner{border-bottom:1px solid var(--line);padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--muted);position:sticky;top:0;left:0;z-index:4}
.mon{border-left:2px solid var(--muted)!important}
.g-h.mon,.g-h.first{scroll-snap-align:start}
.g-mlabel{border-bottom:1px solid var(--line);padding:6px 10px;font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center}
.g-m{padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--surface2);min-height:30px}
.ms{font-size:10px;line-height:1.2;padding:2px 5px;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,var(--surface));border-left:3px solid var(--c);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms.del{font-weight:800;font-size:11px;padding:4px 6px;background:var(--c);color:var(--ink,var(--bg));border-left:0;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 0 0 2px var(--fg);margin:2px}
.ms.del::before{content:"⚑ ";font-weight:400}
.g-h.dl{background:var(--dc);color:var(--dink,var(--bg));box-shadow:inset 0 -3px 0 var(--fg)} .g-h.dl .wk{color:var(--dink,var(--bg))}
.g-h.today.dl{background:var(--ok);color:var(--bg);box-shadow:inset 0 -6px 0 var(--dc)}
.g-c.dl{background-image:linear-gradient(color-mix(in srgb,var(--dc) 20%,transparent),color-mix(in srgb,var(--dc) 20%,transparent));box-shadow:inset 3px 0 0 var(--dc),inset -3px 0 0 var(--dc)}
.g-n{padding:7px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px;text-align:left;border-top:0;border-right:0;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.g-n:hover .pn{text-decoration:underline}
.pn{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.pr{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl{font-family:var(--mono);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.flag{font-family:var(--mono);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--bad);border:1px solid currentColor;border-radius:3px;padding:0 4px}
.row-bottle{background:color-mix(in srgb,var(--bad) 5%,var(--surface))}
.g-c{position:relative;min-height:58px;padding:3px;display:grid;grid-template-rows:1fr 1fr;grid-auto-flow:column dense;grid-auto-columns:minmax(0,1fr);gap:2px}
.g-c.today{background-color:color-mix(in srgb,var(--ok) 11%,transparent);box-shadow:inset 2px 0 0 color-mix(in srgb,var(--ok) 55%,transparent),inset -2px 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}
.g-c.drop{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.g-c[data-zone]::before{content:attr(data-zone);position:absolute;left:2px;right:2px;z-index:3;border:2px dashed var(--accent);border-radius:4px;
  background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent);font-family:var(--mono);font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;pointer-events:none}
.g-c[data-zone="FM"]::before{top:2px;height:calc(50% - 3px)} .g-c[data-zone="EM"]::before{bottom:2px;height:calc(50% - 3px)} .g-c[data-zone="Heldag"]::before{top:2px;bottom:2px}
.card[draggable="true"],.chip[draggable="true"]{cursor:grab}
.card{cursor:pointer}
.hit{position:absolute;left:0;right:0;height:50%;border:0;background:transparent;z-index:0;padding:0}
.hit.am{top:0} .hit.pm{bottom:0}
.hit:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.hit:hover::after{content:"+";position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted)}
.plus{position:absolute;right:1px;bottom:1px;z-index:2;width:16px;height:16px;border:0;border-radius:3px;background:var(--surface2);color:var(--muted);font-size:12px;line-height:1;padding:0;opacity:0}
.g-c:hover .plus,.plus:focus-visible{opacity:1}
@media (hover:none){.plus{opacity:.8}}
.blk{position:relative;z-index:1;border:0;background:color-mix(in srgb,var(--c) 30%,var(--surface));color:color-mix(in srgb,var(--c) 45%,var(--fg));border-radius:6px;
  padding:4px 6px;font-size:11px;font-weight:600;letter-spacing:.01em;text-align:left;overflow:hidden;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;gap:1px;line-height:1.2}
.blk.full{grid-row:1 / span 2} .blk.am{grid-row:1} .blk.pm{grid-row:2}
.blk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .hrs{float:right;margin-left:6px;padding:0 5px;border-radius:3px;background:var(--c);color:var(--bg);font-family:var(--mono);font-size:10px;font-weight:700;line-height:15px}
.blk.cl .hrs{visibility:hidden}
.blk em{font-style:normal;font-family:var(--mono);font-weight:500;font-size:9px;color:inherit;opacity:.75}

.blk[draggable="true"]{cursor:grab}
.blk .rm{position:absolute;top:2px;right:9px;z-index:4;width:15px;height:15px;border:0;border-radius:3px;padding:0;background:var(--surface);color:var(--bad);font-size:13px;font-weight:700;line-height:15px;text-align:center;opacity:0;box-shadow:0 0 0 1px var(--line)}
.blk:hover .rm,.blk:focus-within .rm,.rm:focus-visible{opacity:1}
.blk .rm:hover{background:var(--bad);color:#fff}
@media (hover:none){.blk .rm{opacity:.85}}
.toast button{margin-left:10px;border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;padding:0}
.blk.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-4px}
.mon .blk.cl{margin-left:-5px}
.blk.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-4px}
.blk.cl>span,.blk.cl>em{visibility:hidden}
.blk.cl .rh.l,.blk.cr .rh.r{display:none}
.blk.cr .rm{right:6px}

.grid.ovmode .blk,.grid.ovmode .plus,.grid.ovmode .badge,.grid.ovmode .hit{visibility:hidden}
.grid.ovmode .g-c.today{box-shadow:inset 2px 0 0 color-mix(in srgb,var(--ok) 55%,transparent),inset -2px 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}
.grid.ovmode .g-c.dl{box-shadow:inset 3px 0 0 var(--dc),inset -3px 0 0 var(--dc)}
/* frånvaro */
.ab{position:relative;z-index:1;border-radius:3px;font-size:10px;font-weight:600;color:var(--muted);padding:2px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  background:repeating-linear-gradient(135deg,var(--surface2) 0 5px,color-mix(in srgb,var(--muted) 18%,var(--surface2)) 5px 10px);border:1px solid var(--line);cursor:default}
.ab.full{grid-row:1 / span 2} .ab.am{grid-row:1} .ab.pm{grid-row:2}
.g-c.absday .hit{cursor:not-allowed}
/* preliminär */
.blk.tent{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,var(--surface)) 0 6px,color-mix(in srgb,var(--c) 10%,var(--surface)) 6px 12px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent);font-style:italic}
.blk.tent>span::after{content:" ?";font-style:normal;opacity:.7}
/* veckobeläggning */
.wls{display:flex;gap:3px;margin-top:3px}
.wl{display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--mono);font-size:8.5px;color:var(--muted);width:30px}
.wl b{display:block;width:100%;height:5px;border-radius:2px;background:var(--surface2);position:relative;overflow:hidden}
.wl b i{position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--ok)}
.wl.warn b i{background:var(--warn)} .wl.bad b i{background:var(--bad)} .wl.bad{color:var(--bad);font-weight:600}
@media (max-width:640px){.wl:nth-child(n+4){display:none}}
/* leveransrisk */
.ms.del.risk{box-shadow:0 0 0 2px var(--bad),0 0 0 4px color-mix(in srgb,var(--bad) 30%,transparent)}
.ms.del.risk::after{content:" !";color:var(--bad);background:var(--surface);border-radius:50%;padding:0 4px;margin-left:3px;font-weight:800}
.daylist .risk{font-size:12px;color:var(--bad);font-weight:600;margin-top:3px;display:block}
/* resurser */
.g-n[draggable="true"]{cursor:grab}
.g-n.dropb{box-shadow:inset 0 3px 0 var(--accent)} .g-n.dropa{box-shadow:inset 0 -3px 0 var(--accent)}
.g-n.dragging{opacity:.4}
.g-sep span{position:sticky;left:10px}
.g-sep{grid-column:1 / -1;padding:6px 10px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--line)}
.g-n.res .pn::before{content:"◇ ";color:var(--muted)}
.ovnote{grid-column:1 / -1;padding:10px 12px;font-size:12px;color:var(--muted);position:sticky;left:0}
.blk .rh{position:absolute;top:0;bottom:0;width:8px;z-index:3;cursor:ew-resize;touch-action:none}
.blk .rh.r{right:0} .blk .rh.l{left:-3px}
.blk .rh::after{content:"";position:absolute;top:25%;bottom:25%;width:2px;border-radius:1px;background:var(--fg);opacity:0;left:3px}
.blk:hover .rh::after{opacity:.45}
@media (hover:none){.blk .rh::after{opacity:.3}}
.g-c.rs{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.g-c.rs-del{box-shadow:inset 0 0 0 2px var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
body.resizing,body.resizing *{cursor:ew-resize!important;user-select:none}
.ms.av{font-weight:500;background:var(--surface);color:var(--muted);border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));border-left:3px solid var(--c)}
.ms{cursor:pointer}
.ms:hover{filter:brightness(1.08);box-shadow:0 0 0 1px var(--c)}
.g-m.tall{min-height:52px;padding:5px 4px}
.g-m.tall .ms{white-space:normal;font-size:11px;line-height:1.25;padding:4px 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-height:calc(3.75em + 8px);flex-shrink:0}
.g-m.tall .g-mlabel{font-weight:600}
.g-h.avd{box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--ac) 70%,transparent);color:var(--fg)}
.g-c.avd{background-image:linear-gradient(color-mix(in srgb,var(--ac) 6%,transparent),color-mix(in srgb,var(--ac) 6%,transparent))}
.g-m.tall.ov{min-height:44px;gap:4px}
.g-m.tall.ov .ms{display:block;-webkit-line-clamp:unset;max-height:none;white-space:normal;overflow:visible;font-size:11.5px;line-height:1.3}
.daylist{display:flex;flex-direction:column;gap:8px}
.daylist .it{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:8px 10px;border-radius:6px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.daylist .it b{display:block;font-size:13px} .daylist .it span{font-size:13px} .daylist .it.del{background:color-mix(in srgb,var(--c) 28%,var(--surface))}
.daylist .tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card .shl{color:var(--accent);text-decoration:none;font-weight:500}
.card .shl:hover{text-decoration:underline}
.card .next{font-size:12px;color:var(--fg);display:flex;gap:6px;align-items:baseline}

    <div class="bar"><span id="note" class="note" role="status"></span><button type="button" class="btn" id="syncBtn" title="Hämta projekt, personer, frånvaro och tidsplaner från Monday och Google Sheets">⟳ Synka Monday</button></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Vy">

    <div class="pipe"><div class="phases" id="phases"></div></div>
    <details class="arch" id="arch" hidden><summary></summary><div class="archlist" id="archlist"></div></details>
  </section>

      <h2 id="h-grid">Beläggning</h2>

        <div class="seg"><button type="button" id="prev" aria-label="Föregående vecka">←</button><button type="button" id="today">Idag</button><button type="button" id="next" aria-label="Nästa vecka">→</button></div>
        <div class="seg" id="weeks"><button type="button" data-w="1">1 v</button><button type="button" data-w="2">2 v</button><button type="button" data-w="3">3 v</button><button type="button" data-w="4">4 v</button><button type="button" data-w="6">6 v</button><button type="button" data-w="8">8 v</button></div>

<script>
const PHASES=["Uppstart","Pre-prod","Produktion","Post / VFX","Korr & leverans","Löpande"];
const PARTS={full:"Heldag",am:"FM",pm:"EM"}, W={full:1,am:.5,pm:.5};
const DAYH=8; // timmar per heldag
const bw=b=>b.hours>0?Math.min(b.hours,DAYH*1.5)/DAYH:(W[b.part]||0); // blockets vikt i dagar
const fmtH=h=>(Math.round(h*2)/2).toString().replace(".",",")+" h";
const DAYN=["sön","mån","tis","ons","tor","fre","lör"];
const MON=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const S={projects:{},people:{},blocks:{},absence:{}};
let db=null;
const view={start:null,weeks:3,focus:null};
let weeksPref=3; try{const w=+localStorage.getItem("cp_weeks"); if(w>=1&&w<=8) weeksPref=w}catch(e){}
view.weeks=weeksPref;
let showMs=false; try{showMs=localStorage.getItem("cp_ms")==="1"}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;return addD(x,-k)};
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};
const nice=s=>{if(!s)return"";const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()]}`};
const fmtD=n=>String(Math.round(n*10)/10).replace(".",",");
const TODAY=iso(new Date());
const todayStart=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
view.start=todayStart();
const workdaysUntil=s=>{let a=parse(TODAY),b=parse(s),n=0,sign=b>=a?1:-1;if(sign<0)[a,b]=[b,a];while(a<b){a=addD(a,1);const g=a.getDay();if(g&&g<6)n++}return n*sign};
const sorted=col=>Object.entries(S[col]).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order??99)-(b.order??99)||String(a.name).localeCompare(b.name));
const activeProjects=()=>sorted("projects").filter(p=>!p.archived);
const HEX=/^#[0-9a-f]{6}$/i;
const ink=p=>{const c=p?.color;if(typeof c==="string"&&HEX.test(c)){const n=parseInt(c.slice(1),16);return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))>150?"#111":"#fff"}return"var(--bg)"};
const pc=p=>typeof p?.color==="string"&&HEX.test(p.color)?p.color:`var(--p${(+p?.color||0)%9})`;

async function syncMonday(){
  const b=$("#syncBtn");if(!b||b.classList.contains("busy"))return;
  const label=b.textContent;b.classList.add("busy");b.textContent="Synkar…";
  try{
    const r=await fetch("api/monday/sync",{method:"POST"});const j=await r.json().catch(()=>({}));
    if(!r.ok||j.error)throw new Error(j.error||r.statusText);
    const sh=j.sheets||{};const err=(sh.errors||[]).length;
    toast(`Synkat: ${j.projects??0} projekt, ${j.people??0} personer, ${j.absence??0} frånvaro, ${sh.synced??0} tidsplaner${err?` · ${err} tidsplan(er) kunde inte läsas`:""}`);
    if(err)console.warn("Tidsplaner:",sh.errors);
    if(typeof window.__refresh==="function")window.__refresh();
  }catch(e){toast("Synk misslyckades: "+e.message)}
  finally{b.classList.remove("busy");b.textContent=label}
}
function toast(t,undo){const el=$("#toast");el.textContent=t;
  if(undo){const b=document.createElement("button");b.type="button";b.textContent="Ångra";b.onclick=()=>{undo();el.hidden=true};el.appendChild(b)}
  el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,undo?6000:2600)}
function setNote(t){$("#note").textContent=t}

async function put(col,id,data){S[col]={...S[col],[id]:data};render();if(!db)return;
  try{await db.collection(col).doc(id).set(data)}catch(e){toast(e?.code==="invalid_argument"?"Du har inte behörighet att ändra planeringen.":e?.code==="quota_exceeded"?"Planeringen är full – ta bort gamla block.":"Kunde inte spara. Försök igen.")}}
async function del(col,id){const n={...S[col]};delete n[id];S[col]=n;render();if(!db)return;
  try{await db.collection(col).doc(id).delete()}catch(e){toast("Kunde inte ta bort. Försök igen.")}}
const nid=p=>p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* ---------- Pipeline ---------- */
const isDel=t=>/^leverans/i.test(t||"");
const msOf=p=>{const l=(p.milestones||[]).slice();if(p.delivery&&!l.some(m=>m.d===p.delivery&&isDel(m.t)))l.push({d:p.delivery,t:"Leverans"});return l.sort((a,b)=>a.d.localeCompare(b.d))};
function projStats(p){
  let booked=0;for(const b of Object.values(S.blocks))if(b.projectId===p.id)booked+=bw(b);
  const next=msOf(p).find(m=>m.d>=TODAY&&!(m.d===p.delivery&&isDel(m.t)));
  return{booked,next};
}
let pipeCompact=true;try{pipeCompact=localStorage.getItem("pipeCompact")!=="0"}catch(e){}
function renderPipeline(){
  window.tipHide?.();
  const ps=activeProjects();
  $("#phases").classList.toggle("compact",pipeCompact);
  const pm=$("#pipeMode");if(pm){pm.textContent=pipeCompact?"Detaljer":"Kompakt";pm.setAttribute("aria-pressed",String(pipeCompact))}
  $("#phases").innerHTML=PHASES.map((ph,i)=>{
    const list=ps.filter(p=>(p.phase??0)===i);
    return `<div class="phase"><h3><span>${esc(ph)}</span><span>${list.length||""}</span></h3>${list.map(p=>{
      const s=projStats(p);const left=p.delivery?workdaysUntil(p.delivery):null;
      const own=p.owner&&S.people[p.owner]?S.people[p.owner].name.split(" ")[0]:"";
      return `<div role="button" tabindex="0" draggable="true" class="card${left!=null&&left>=0&&left<=5?" due":""}" style="--c:${pc(p)}" data-proj="${esc(p.id)}" data-dragproj="${esc(p.id)}" data-tip="${esc(p.id)}">
        <span class="nm"><b>${esc(p.name)}</b><span class="code">${p.sheet&&/^https:\/\/(docs|drive)\.google\.com\//.test(p.sheet)?`<a class="shc" href="${esc(p.sheet)}" target="_blank" rel="noopener" title="Öppna tidsplanen" draggable="false">⇗</a>`:""}${esc(p.code||"")}</span></span>
        ${p.status?`<span class="st">${esc(p.status)}</span>`:""}
        ${p.waiting?`<span class="wait">Väntar: ${esc(p.waiting)}</span>`:""}
        <span class="meta">
          <span class="lev">${p.delivery?`Lev ${nice(p.delivery)}${left!=null&&left>=0?` · ${left} d`:""}`:"Lev TBC"}</span>
          ${s.next?`<span title="${esc(s.next.t)}">Nästa ${s.next.d===TODAY?"idag":nice(s.next.d)}</span>`:""}
          ${p.budget&&s.booked>p.budget?`<span class="over">Över budget</span>`:""}
          ${p.sheet&&/^https:\/\/(docs|drive)\.google\.com\//.test(p.sheet)?`<a class="shl" href="${esc(p.sheet)}" target="_blank" rel="noopener">Tidsplan ↗</a>`:""}
        </span></div>`}).join("")||`<div class="empty">Inga produktioner</div>`}

function absMap(){const m={};for(const [id,a] of Object.entries(S.absence||{})){if(!a.from||!a.to)continue;let d=parse(a.from);const e=parse(a.to);let g=0;
  while(d<=e&&g<400){g++;const k=iso(d),wd=d.getDay();if(wd&&wd<6){const who=a.personId||"*";(m[who+"|"+k]??=[]).push({id,...a})}d=addD(d,1)}}return m}
function absFor(am,pid,date){return [...(am[pid+"|"+date]||[]),...(am["*|"+date]||[])]}
const absW=a=>a.part==="am"||a.part==="pm"?.5:1;
function prevWorkdays(dateStr,n){const out=[dateStr];let d=parse(dateStr);while(out.length<=n){d=addD(d,-1);const g=d.getDay();if(g&&g<6)out.push(iso(d))}return out}
function deliveryRisk(idx,am){const risk={};
  for(const p of activeProjects()){if(!p.delivery)continue;const win=prevWorkdays(p.delivery,3);const hits=[];
    const ppl=new Set();for(const b of Object.values(S.blocks))if(b.projectId===p.id&&win.includes(b.date))ppl.add(b.personId);
    for(const pid of ppl){const bad=[];for(const d of win){const load=(idx[pid+"|"+d]||[]).reduce((a,b)=>a+bw(b),0)+absFor(am,pid,d).reduce((a,x)=>a+absW(x),0);
        const absent=absFor(am,pid,d).length&&(idx[pid+"|"+d]||[]).some(b=>b.projectId===p.id);
        if(absent)bad.push(d)}
      if(bad.length)hits.push(`${S.people[pid]?.name||pid} är bokad men frånvarande ${bad.sort().map(x=>nice(x)).join(", ")}`)}
    if(hits.length)risk[p.delivery+"|"+p.id]=hits}
  return risk}
function weekLoads(pid,ds,idx,am){const wk=[];let cur=null;
  for(const d of ds){const w=isoWeek(d);if(!cur||cur.w!==w){if(wk.length>=4)break;cur={w,booked:0,cap:0,over:0};wk.push(cur)}
    const k=iso(d);const ab=absFor(am,pid,k).reduce((a,x)=>a+absW(x),0);cur.cap+=Math.max(0,1-ab);
    const dl=(idx[pid+"|"+k]||[]).reduce((a,b)=>a+bw(b),0);cur.booked+=dl;if(dl+ab>1.001)cur.over++}
  return wk}

const grid=$("#grid");

const sameKind=(b,ref)=>b.personId===ref.personId&&b.projectId===ref.projectId&&b.part===ref.part;
function rowCells(pid){return [...grid.querySelectorAll(".g-c")].filter(c=>c.dataset.p===pid)}
function findAt(pid,date,ref){for(const[id,b]of Object.entries(S.blocks))if(b.date===date&&sameKind(b,{...ref,personId:pid}))return id;return null}
function rsPlan(){
  const cells=rs.cells,i0=rs.i0,it=rs.it,ref=rs.ref,add=[],rem=[];
  if(rs.side==="r"){
    if(it>i0)for(let i=i0+1;i<=it;i++){if(!findAt(ref.personId,cells[i].dataset.d,ref))add.push(i)}
    else if(it<i0)for(let i=i0;i>it;i--){const id=findAt(ref.personId,cells[i].dataset.d,ref);if(id)rem.push([i,id])}
  }else{
    if(it<i0)for(let i=it;i<i0;i++){if(!findAt(ref.personId,cells[i].dataset.d,ref))add.push(i)}
    else if(it>i0)for(let i=i0;i<it;i++){const id=findAt(ref.personId,cells[i].dataset.d,ref);if(id)rem.push([i,id])}
  }
  return{add,rem};
}
function rsPaint(){rs.cells.forEach(c=>c.classList.remove("rs","rs-del"));const{add,rem}=rsPlan();
  const ref=rs.cells[rs.i0];if(add.length||!rem.length)ref.classList.add("rs");add.forEach(i=>rs.cells[i].classList.add("rs"));rem.forEach(([i])=>rs.cells[i].classList.add("rs-del"))}
grid.addEventListener("pointerdown",e=>{const h=e.target.closest("[data-rh]");if(!h)return;
  const el=h.closest("[data-blk]"),b=S.blocks[el?.dataset.blk];if(!b)return;
  e.preventDefault();e.stopPropagation();
  const cells=rowCells(b.personId),i0=cells.findIndex(c=>c.dataset.d===b.date);if(i0<0)return;
  rs={id:el.dataset.blk,ref:{...b},side:h.dataset.rh,cells,i0,it:i0};document.body.classList.add("resizing");
  try{h.setPointerCapture(e.pointerId)}catch(_){} rsPaint()});
document.addEventListener("pointermove",e=>{if(!rs)return;
  let it=rs.it;for(let i=0;i<rs.cells.length;i++){const r=rs.cells[i].getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<r.right){it=i;break}
    if(i===0&&e.clientX<r.left)it=0;if(i===rs.cells.length-1&&e.clientX>=r.right)it=i}
  if(it!==rs.it){rs.it=it;rsPaint()}});
function rsEnd(commit){if(!rs)return;const{add,rem}=commit?rsPlan():{add:[],rem:[]};const ref=rs.ref,cells=rs.cells;
  cells.forEach(c=>c.classList.remove("rs","rs-del"));document.body.classList.remove("resizing");
  if(add.length||rem.length){swallowClick=true;setTimeout(()=>swallowClick=false,50)}
  rs=null;
  for(const i of add)put("blocks",nid("b"),{personId:ref.personId,date:cells[i].dataset.d,part:ref.part,projectId:ref.projectId,note:ref.note||""});
  for(const[,id]of rem)del("blocks",id);
  if(add.length)toast(`Förlängt ${add.length} dag${add.length>1?"ar":""}`);else if(rem.length)toast(`Kortat ${rem.length} dag${rem.length>1?"ar":""}`)}
document.addEventListener("pointerup",()=>rsEnd(true));
document.addEventListener("pointercancel",()=>rsEnd(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&rs)rsEnd(false)});

const clearDrop=()=>grid.querySelectorAll("[data-zone]").forEach(x=>{x.removeAttribute("data-zone");x.classList.remove("drop")});
const clearPdrop=()=>grid.querySelectorAll(".dropa,.dropb,.dragging").forEach(x=>x.classList.remove("dropa","dropb","dragging"));
grid.addEventListener("dragover",e=>{if(!drag||drag.kind!=="person")return;const n=e.target.closest(".g-n");if(!n)return;e.preventDefault();e.dataTransfer.dropEffect="move";
  const r=n.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;grid.querySelectorAll(".dropa,.dropb").forEach(x=>x!==n&&x.classList.remove("dropa","dropb"));
  n.classList.toggle("dropa",after);n.classList.toggle("dropb",!after)});
grid.addEventListener("drop",e=>{if(!drag||drag.kind!=="person")return;const n=e.target.closest(".g-n");e.preventDefault();
  if(n&&n.dataset.person!==drag.id){const r=n.getBoundingClientRect();movePerson(drag.id,n.dataset.person,e.clientY>r.top+r.height/2)}
  clearPdrop();drag=null});
grid.addEventListener("dragover",e=>{const c=e.target.closest(".g-c");if(!c||!drag||drag.kind==="person")return;e.preventDefault();
  e.dataTransfer.dropEffect=drag.kind==="proj"||e.altKey?"copy":"move";
  const z=PARTS[zoneFor(e,c)];grid.querySelectorAll("[data-zone]").forEach(x=>x!==c&&(x.removeAttribute("data-zone"),x.classList.remove("drop")));
  if(c.dataset.zone!==z)c.dataset.zone=z;c.classList.add("drop")});
grid.addEventListener("dragleave",e=>{const c=e.target.closest(".g-c");if(c&&!c.contains(e.relatedTarget)){c.removeAttribute("data-zone");c.classList.remove("drop")}});
grid.addEventListener("drop",e=>{const c=e.target.closest(".g-c");if(!c||!drag||drag.kind==="person")return;e.preventDefault();
  const part=zoneFor(e,c);clearDrop();
  if(absFor(absMap(),c.dataset.p,c.dataset.d).length)toast(`${S.people[c.dataset.p]?.name||""} är frånvarande ${nice(c.dataset.d)} enligt Monday.`);
  if(drag.kind==="proj"){if(S.projects[drag.id])put("blocks",nid("b"),{personId:c.dataset.p,date:c.dataset.d,part,projectId:drag.id,note:""})}
  else{const b=S.blocks[drag.id];if(b){const nb={...b,personId:c.dataset.p,date:c.dataset.d,part};
    if(e.altKey)put("blocks",nid("b"),nb);else if(nb.personId!==b.personId||nb.date!==b.date||nb.part!==b.part)put("blocks",drag.id,nb)}}
  drag=null});
document.addEventListener("dragend",()=>{drag=null;clearDrop();clearPdrop()});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches?.('[role="button"]')){e.preventDefault();e.target.click()}});

/* ---------- Lokalt db-shim: samma API som artefaktens db, men mot /api (server/server.js) ---------- */
function localDb(base){
  const subs={};
  const load=async col=>{const r=await fetch(`${base}/${col}`,{cache:"no-store"});if(!r.ok)throw Object.assign(new Error(r.statusText),{code:r.status});return r.json()};
  const notify=col=>(subs[col]||[]).forEach(f=>f());
  const write=async(col,id,method,body)=>{const r=await fetch(`${base}/${col}/${encodeURIComponent(id)}`,{method,headers:{"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
    if(!r.ok)throw Object.assign(new Error(r.statusText),{code:r.status===403?"invalid_argument":"error"});notify(col)};
  setInterval(()=>Object.keys(subs).forEach(notify),15000);
  window.__refresh=()=>Object.keys(subs).forEach(notify);
  return {collection(col){return{
    onSnapshot(cb,err){const run=()=>load(col).then(o=>cb({docs:Object.entries(o).map(([id,data])=>({id,data:()=>data})),metadata:{fromCache:false}})).catch(e=>err?.(e));
      (subs[col]??=[]).push(run);run();return()=>{subs[col]=subs[col].filter(f=>f!==run)}},
    doc(id){return{set:data=>write(col,id,"PUT",data),delete:()=>write(col,id,"DELETE")}}}}}}

/* ---------- Data ---------- */
render();
(async()=>{
  try{db=await window.claude?.use?.("db")}catch(e){db=null}
  if(!db)db=localDb("api");
  if(!db){setNote("Planeringen kan inte laddas i den här vyn – ändringar sparas inte.");return}
  setNote("Laddar planeringen…");
  const timer=setTimeout(()=>setNote("Får ingen kontakt med planeringen än. Det kan visa gammal data."),10000);
  const done=new Set();
  for(const col of ["projects","people","blocks","absence"]){
    db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S[col]=o;
      if(!snap.metadata.fromCache){done.add(col);if(done.size===4){clearTimeout(timer);setNote(Object.keys(S.people).length?"":"Tomt än – lägg till personer och produktioner med plus.")}}
      render()},
      err=>{clearTimeout(timer);setNote(err?.code==="revoked"?"Åtkomsten till planeringen har ändrats.":"Anslutningen bröts – ladda om sidan.")});
  }
})();
